name: neuralforge
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - jupyterlab>=4.0
  - ipykernel>=6.0
  - numpy>=1.24
  - pandas>=2.0
  - matplotlib>=3.7
  - seaborn>=0.12
  - scikit-learn>=1.3
  - statsmodels>=0.14
  - pyyaml>=6.0
  - python-dotenv>=1.0
  - joblib>=1.3
  - pip:
    - xgboost>=2.0
    - shap>=0.43
    - streamlit>=1.30
    - pytest>=7.0
    - black>=23.0
    - isort>=5.0
    - flake8>=6.0
